name: example-docker
on:
  push:
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-browsers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge, firefox]
    # Cypress Docker image documentation on https://github.com/cypress-io/cypress-docker-images
    # Available cypress/browsers tags listed on https://hub.docker.com/r/cypress/browsers/tags
    container:
      image: cypress/browsers:24.16.0
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cypress tests
        uses: ./ # if copying, replace with step-security/cypress-io-github-action@v7
        with:
          working-directory: examples/basic
          browser: ${{ matrix.browser }}
